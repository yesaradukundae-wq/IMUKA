<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMUKA - Seamless Relocation in Kigali</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --navy: #0A192F;
      --gold: #D4AF37;
      --gold-hover: #C5A028;
      --bg-cream: #FAF9F6;
      --card-bg: #FFFFFF;
      --text: #1E293B;
      --border: #E2E8F0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      background-color: var(--bg-cream); 
      color: var(--text); 
      line-height: 1.6;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 30px 10px;
      background-color: var(--navy);
      color: white;
      border-radius: 12px 12px 0 0;
      border-bottom: 4px solid var(--gold);
    }

    header h1 {
      color: var(--gold);
      font-size: 2.2rem;
      letter-spacing: 1px;
    }

    header p {
      color: #CBD5E1;
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .nav-links {
      margin-top: 15px;
    }

    .nav-links a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      border: 1px solid var(--gold);
      padding: 6px 14px;
      border-radius: 20px;
      transition: all 0.2s;
    }

    .nav-links a:hover {
      background-color: var(--gold);
      color: var(--navy);
    }

    .form-container {
      max-width: 600px;
      margin: 0 auto 40px auto;
      background: var(--card-bg);
      padding: 32px;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 8px 24px rgba(10, 25, 47, 0.08);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background-color: #FAFAFA;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--gold);
      background-color: #FFF;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 600px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--gold);
      color: var(--navy);
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: var(--gold-hover);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <header>
    <h1>IMUKA</h1>
    <p>Seamless Relocation & Logistics Services in Kigali</p>
    <div class="nav-links">
      <a href="status.html">Track Existing Booking ➔</a>
    </div>
  </header>

  <div class="form-container">
    <form id="bookingForm" onsubmit="submitBooking(event)">
      
      <div class="grid-2">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" required placeholder="078XXXXXXX">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="pickup">Pickup Neighborhood</label>
          <input type="text" id="pickup" required placeholder="e.g. Gikondo">
        </div>
        <div class="form-group">
          <label for="destination">Destination Neighborhood</label>
          <input type="text" id="destination" required placeholder="e.g. Kimihurura">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="moveType">Type of Move</label>
          <select id="moveType" required>
            <option value="Residential (House/Apartment)">Residential (House/Apartment)</option>
            <option value="Commercial/Office">Commercial / Office</option>
            <option value="Single Items / Heavy Moving">Single Items / Heavy Moving</option>
          </select>
        </div>
        <div class="form-group">
          <label for="truckSize">Truck Size Required</label>
          <select id="truckSize" required>
            <option value="Small Pickup Truck">Small Pickup Truck</option>
            <option value="Medium Moving Van">Medium Moving Van</option>
            <option value="Large Canter Truck">Large Canter Truck</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="moveDate">Preferred Move Date</label>
        <input type="date" id="moveDate" required>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Submit Relocation Request</button>
    </form>
  </div>

<script>
  // Set minimum selectable date to TODAY in Kigali
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('moveDate').setAttribute('min', today);

  const SUPABASE_URL = "https://kjclnylnmfdgnadnmbfz.supabase.co";
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqY2xueWxubWZkZ25hZG5tYmZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNTg1NTksImV4cCI6MjEwMjkzNDU1OX0.dLwbaU2-Nr2fPeaHwm7_h2GvMwbx8uMrxjqOTdpTO9w';
  
  // Using supabaseClient prevents syntax conflict with global library
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function submitBooking(event) {
    event.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.innerText = "Submitting...";
    btn.disabled = true;

    const bookingData = {
      full_name: document.getElementById('fullName').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      pickup: document.getElementById('pickup').value.trim(),
      destination: document.getElementById('destination').value.trim(),
      move_type: document.getElementById('moveType').value,
      truck_size: document.getElementById('truckSize').value,
      move_date: document.getElementById('moveDate').value,
      status: 'Pending'
    };

    try {
      const { data, error } = await supabaseClient
        .from('bookings')
        .insert([bookingData])
        .select();

      if (error) throw error;

      const newBooking = data[0];
      alert(`🎉 Booking Request Received!\nYour Booking ID is #${newBooking.id}.\nYou can track it on the Track Booking page using your Phone Number or Booking ID.`);
      document.getElementById('bookingForm').reset();
      document.getElementById('moveDate').setAttribute('min', today); // Re-apply min date after reset
    } catch (err) {
      console.error("Supabase Error:", err);
      alert("Error submitting request: " + (err.message || "Failed to reach database. Verify table permissions in Supabase."));
    } finally {
      btn.innerText = "Submit Relocation Request";
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
