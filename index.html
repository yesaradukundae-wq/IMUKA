<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMUKA - Book Your Move</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-12 px-4">

  <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-md border border-slate-200">
    <h2 class="text-2xl font-bold text-slate-900 mb-2">Book Your Move with IMUKA</h2>
    <p class="text-sm text-slate-500 mb-6">Transparent flat rates across Kigali. No hidden fees.</p>

    <form id="booking-form" class="space-y-6">
      <!-- 1. Move Size Selection -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Select Move Size</label>
        <select id="moveSize" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none">
          <option value="small">Small Move (Studio / 1 Bedroom) - 35,000 RWF</option>
          <option value="medium">Medium Move (2-3 Bedrooms) - 55,000 RWF</option>
          <option value="large">Large Move (House / Office) - 85,000 RWF</option>
        </select>
      </div>

      <!-- 2. Floor Access Details -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 p-4 bg-slate-50 rounded-lg border border-slate-200">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Pickup Location Access</label>
          <select id="pickupFloor" class="w-full p-2 border border-slate-300 rounded-md text-sm bg-white">
            <option value="Ground Floor">Ground Floor</option>
            <option value="Stairs (1st-2nd Floor)">Stairs (1st-2nd Floor)</option>
            <option value="Stairs (3rd Floor+)">Stairs (3rd Floor+)</option>
            <option value="Elevator Available">Has Elevator</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Dropoff Location Access</label>
          <select id="dropoffFloor" class="w-full p-2 border border-slate-300 rounded-md text-sm bg-white">
            <option value="Ground Floor">Ground Floor</option>
            <option value="Stairs (1st-2nd Floor)">Stairs (1st-2nd Floor)</option>
            <option value="Stairs (3rd Floor+)">Stairs (3rd Floor+)</option>
            <option value="Elevator Available">Has Elevator</option>
          </select>
        </div>
      </div>

      <!-- 3. Optional Notes -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Additional Details (Optional)</label>
        <textarea id="specialNotes" rows="2" placeholder="Fragile items, narrow gates, heavy furniture..." class="w-full p-3 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none"></textarea>
      </div>

      <!-- 4. Price Card -->
      <div class="p-4 bg-slate-900 text-white rounded-lg flex justify-between items-center">
        <div>
          <p class="text-xs text-slate-400 uppercase tracking-wide">Total Fixed Price</p>
          <p id="priceDisplay" class="text-2xl font-bold">35,000 RWF</p>
        </div>
        <span class="text-xs bg-amber-500 text-slate-900 font-bold px-3 py-1 rounded-full">All Inclusive</span>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold rounded-lg transition">
        Request Move Now
      </button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
