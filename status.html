<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMUKA - Track Your Relocation</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --navy: #0A192F;
      --gold: #D4AF37;
      --gold-hover: #C5A028;
      --bg: #FAF9F6;
    }
    body { font-family: system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
    .container { max-width: 500px; margin: 40px auto; background: white; padding: 28px; border-radius: 12px; border-top: 5px solid var(--gold); box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h2 { color: var(--navy); margin-top: 0; }
    input { width: 100%; padding: 12px; margin: 10px 0 16px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .btn-track { width: 100%; padding: 12px; background: var(--gold); color: var(--navy); border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-track:hover { background: var(--gold-hover); }
    .card { background: #fdfdfd; border: 1px solid #e2e8f0; border-left: 4px solid var(--navy); padding: 16px; border-radius: 6px; margin-top: 16px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .badge-Pending { background: #FEF3C7; color: #92400E; }
    .badge-Approved { background: #D1FAE5; color: #065F46; }
    .badge-Cancelled { background: #FEE2E2; color: #991B1B; }
    .btn-cancel { background: #DC2626; color: white; margin-top: 12px; padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <h2>Track Your Relocation</h2>
  <label for="search">Enter Phone Number or Booking ID:</label>
  <input type="text" id="search" placeholder="e.g. 078XXXXXXX or 12">
  <button class="btn-track" onclick="trackBooking()">Find Booking</button>

  <div id="results"></div>
</div>

<script>
  const SUPABASE_URL = "https://kjclnylnmfdgnadnmbfz.supabase.co";
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqY2xueWxubWZkZ25hZG5tYmZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNTg1NTksImV4cCI6MjEwMjkzNDU1OX0.dLwbaU2-Nr2fPeaHwm7_h2GvMwbx8uMrxjqOTdpTO9w';
  
  // Renamed client variable to supabaseClient to prevent shadowing errors
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function trackBooking() {
    const input = document.getElementById('search').value.trim();
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = "<p style='color: var(--navy);'>Searching records...</p>";

    if (!input) {
      resultsDiv.innerHTML = "<p style='color:red;'>Please enter a phone number or ID.</p>";
      return;
    }

    let query = supabaseClient.from('bookings').select('*');
    if (!isNaN(input)) {
      query = query.or(`id.eq.${input},phone.ilike.%${input}%`);
    } else {
      query = query.ilike('phone', `%${input}%`);
    }

    const { data, error } = await query.order('created_at', { ascending: false });

    if (error) {
      console.error(error);
      resultsDiv.innerHTML = "<p style='color:red;'>Error querying bookings. Please check your connection or key.</p>";
      return;
    }

    if (!data || data.length === 0) {
      resultsDiv.innerHTML = "<p>No bookings found matching that search.</p>";
      return;
    }

    resultsDiv.innerHTML = data.map(b => `
      <div class="card">
        <h3 style="margin:0 0 8px 0; color:var(--navy);">Booking #${b.id}</h3>
        <p><strong>Name:</strong> ${b.full_name || 'N/A'}</p>
        <p><strong>Route:</strong> ${b.pickup || 'N/A'} ➔ ${b.destination || 'N/A'}</p>
        <p><strong>Status:</strong> <span class="badge badge-${b.status}">${b.status}</span></p>
        
        ${b.status === 'Pending' ? `
          <button class="btn-cancel" onclick="cancelBooking(${b.id})">Cancel This Booking</button>
        ` : ''}
      </div>
    `).join('');
  }

  async function cancelBooking(id) {
    if (!confirm(`Are you sure you want to cancel Booking #${id}?`)) return;

    const { error } = await supabaseClient
      .from('bookings')
      .update({ status: 'Cancelled' })
      .eq('id', id);

    if (error) {
      alert("Error cancelling booking: " + error.message);
    } else {
      alert("Booking cancelled successfully.");
      trackBooking();
    }
  }
</script>

</body>
</html>
